name: Bug report
description: Report a reproducible problem in MCP Flightdeck.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, tokens, customer data, or unredacted traces.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observable behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest safe sequence of commands, configuration, and expected result.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Flightdeck version or commit, OS, runtime, MCP transport, and server version where relevant.
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Safe trace excerpt or logs
      description: Redact all secrets and private data before posting.
    validations:
      required: false
